name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.5
          cache: true
      - name: Test
        run: GOWORK=off go test ./...
      - name: Vet
        run: GOWORK=off go vet ./...
      - name: Staticcheck
        run: |
          GOWORK=off go install honnef.co/go/tools/cmd/staticcheck@v0.5.1
          GOWORK=off "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Documentation
        run: ./scripts/aofei-doc-check.sh
      - name: Public data
        run: ./scripts/aofei-public-data-check.sh
      - name: Install Gitleaks
        run: GOWORK=off go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Secret history
        run: "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .
      - name: Committed diff hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
            git diff --check "$base" "$PR_HEAD_SHA"
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            empty_tree=$(git hash-object -t tree /dev/null)
            git diff --check "$empty_tree" "$PUSH_AFTER_SHA"
          else
            git diff --check "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"
          fi

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.5
          cache: true
      - name: Race tests
        run: GOWORK=off go test -race ./dsp ./match ./internal/jobs/midcallback ./internal/jobs/cache ./internal/jobs/ledger ./cmd/spread ./cmd/nats-client
